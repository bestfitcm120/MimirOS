# ═══════════════════════════════════════════════════════════
#  AIOS nginx config
#  - Serves the built React app (static files)
#  - Proxies /api/* to the backend container on aios_net
#  - Proxies /ws/* for future websocket support
# ═══════════════════════════════════════════════════════════

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    gzip            on;
    gzip_types      text/plain text/css application/json
                    application/javascript text/xml
                    application/xml application/xml+rss text/javascript;

    # Upload size limit (for file uploads through the proxy)
    client_max_body_size 100M;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── Health endpoint (for docker compose healthcheck) ────
        location /health {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ── API proxy → backend:8000 ────────────────────────────
        location /api/ {
            proxy_pass         http://backend:8000/api/;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";

            # Large timeouts for LLM calls which can be slow
            proxy_read_timeout    300s;
            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;

            # Streaming responses (for future SSE support)
            proxy_buffering    off;
            proxy_cache        off;
        }

        # ── React app — SPA fallback ─────────────────────────────
        # All non-API routes serve index.html so React Router works
        location / {
            try_files $uri $uri/ /index.html;

            # Cache static assets aggressively
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }
    }
}
