version: "3.9"

# ═══════════════════════════════════════════════════════════════
#  AIOS — Full Stack Docker Compose
#  All services communicate on the internal `aios_net` network.
#  Only the frontend (port 80) is exposed to the host.
#  Backend API is reachable at http://localhost/api (proxied by nginx).
# ═══════════════════════════════════════════════════════════════

networks:
  aios_net:
    driver: bridge
    name: aios_net

volumes:
  postgres_data:
  redis_data:
  minio_data:
  file_storage:
  embedding_cache:      # sentence-transformers model cache

services:

  # ── PostgreSQL + pgvector ──────────────────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aios_postgres
    restart: unless-stopped
    networks: [aios_net]
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-aios}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aios_secret}
      POSTGRES_DB:       ${POSTGRES_DB:-aios_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not exposed to host — only reachable inside aios_net as "postgres:5432"
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aios} -d ${POSTGRES_DB:-aios_db}"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ── Redis ──────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aios_redis
    restart: unless-stopped
    networks: [aios_net]
    volumes:
      - redis_data:/data
    expose: ["6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── MinIO (S3-compatible file storage) ────────────────────────
  minio:
    image: minio/minio:latest
    container_name: aios_minio
    restart: unless-stopped
    networks: [aios_net]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-aios_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-aios_minio_secret}
    volumes:
      - minio_data:/data
    # Console exposed to host for debugging; API is internal-only
    ports:
      - "9001:9001"
    expose: ["9000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: aios_backend:latest
    container_name: aios_backend
    restart: unless-stopped
    networks: [aios_net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      # Override with internal Docker hostnames — these override whatever is in .env
      DATABASE_URL:      postgresql+asyncpg://${POSTGRES_USER:-aios}:${POSTGRES_PASSWORD:-aios_secret}@postgres:5432/${POSTGRES_DB:-aios_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-aios}:${POSTGRES_PASSWORD:-aios_secret}@postgres:5432/${POSTGRES_DB:-aios_db}
      REDIS_URL:               redis://redis:6379/0
      CELERY_BROKER_URL:       redis://redis:6379/1
      CELERY_RESULT_BACKEND:   redis://redis:6379/2
      MINIO_ENDPOINT:          minio:9000
      MINIO_SECURE:            "false"
    volumes:
      - file_storage:/app/storage
      - embedding_cache:/root/.cache/torch      # cache downloaded embedding model
    expose: ["8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ── Celery Worker ──────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    image: aios_backend:latest
    container_name: aios_worker
    restart: unless-stopped
    networks: [aios_net]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL:      postgresql+asyncpg://${POSTGRES_USER:-aios}:${POSTGRES_PASSWORD:-aios_secret}@postgres:5432/${POSTGRES_DB:-aios_db}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-aios}:${POSTGRES_PASSWORD:-aios_secret}@postgres:5432/${POSTGRES_DB:-aios_db}
      REDIS_URL:               redis://redis:6379/0
      CELERY_BROKER_URL:       redis://redis:6379/1
      CELERY_RESULT_BACKEND:   redis://redis:6379/2
      MINIO_ENDPOINT:          minio:9000
      MINIO_SECURE:            "false"
    volumes:
      - file_storage:/app/storage
      - embedding_cache:/root/.cache/torch
    command: celery -A app.workflows.runner worker --loglevel=info --concurrency=4

  # ── React Frontend (nginx) ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: aios_frontend:latest
    container_name: aios_frontend
    restart: unless-stopped
    networks: [aios_net]
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"        # main app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
